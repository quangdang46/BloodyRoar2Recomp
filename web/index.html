      slots.forEach(function(s){
        var p = br2policy(fs[s], fs[1-s], cds[s]);
        if (p.tap) { tapLeft[s] = 2; cds[s] = 12; }
        else if (cds[s] > 0) cds[s]--;
        var pressed = p.held | (tapLeft[s] > 0 ? p.tap : 0);
        if (tapLeft[s] > 0) tapLeft[s]--;
        /* a queued press wins over the policy word while active */
        var q = window.__padQ && window.__padQ[s];
        if (!(q && q.left > 0))
          Module.ccall('br2_set_pad',null,['number','number'],[s, word(pressed)]);
      });
    } catch(e) { log.textContent += 'agent err ' + e + '\n'; }
  }, 33);
}
</script>
